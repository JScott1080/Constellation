version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: constellation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: constellation
      POSTGRES_PASSWORD: constellation_dev
      POSTGRES_DB: constellation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: constellation-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: constellation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional: Background worker service
  #background:
  #  build:
  #    context: .
  #    dockerfile: Constellation.BackgroundJobs/Dockerfile
  #  container_name: constellation-background
  #  restart: unless-stopped
  #  depends_on:
  #    - postgres
  #    - redis
  #  environment:
  #    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=constellation;Username=constellation;Password=constellation_dev"
  #    Redis__ConnectionString: "redis:6379"

volumes:
  postgres_data:
  redis_data:
